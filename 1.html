<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>频道 1 - 翡翠台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
        }
        
        body {
            background: #000;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .channel-banner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
            z-index: 1000;
            border-radius: 5px;
            animation: fadeOut 5s forwards;
        }
        
        .channel-logo {
            width: 60px;
            height: 60px;
            margin-right: 15px;
            background: url('http://www.redhotmedia.com.cn//FCK/userupfile/images/2009727562397793085.jpg') center/cover;
        }
        
        .channel-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #000;
        }
        
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            z-index: 50;
            font-family: "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 频道标识小窗 -->
    <div class="channel-banner">
        <div class="channel-logo"></div>
        <div class="channel-title">1 翡翠台</div>
    </div>
    
    <!-- 视频播放器 -->
    <div class="video-container">
        <button class="back-btn" onclick="window.location.href='index.html'">返回频道列表</button>
        <iframe class="video-player" src="http://php.jdshipin.com:8880/smt.php?id=jade_twn" frameborder="0" allowfullscreen></iframe>
    </div>
</body>
</html>
